<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Autoelevador industrial">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD426"/>
      <stop offset="100%" stop-color="#D9AE00"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A5A5A"/>
      <stop offset="50%" stop-color="#8A8A8A"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <pattern id="floor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#232323" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="430" width="800" height="170" fill="#1B1B1B"/>
  <rect y="430" width="800" height="170" fill="url(#floor)" opacity=".6"/>

  <!-- Estanterías de fondo -->
  <g opacity=".22" fill="none" stroke="#8A8A8A" stroke-width="6">
    <path d="M60 160v270M170 160v270M60 160h110M60 250h110M60 340h110"/>
    <path d="M640 190v240M750 190v240M640 190h110M640 280h110M640 370h110"/>
  </g>
  <g opacity=".16" fill="#F5C400">
    <rect x="72" y="200" width="86" height="42" rx="3"/>
    <rect x="72" y="290" width="86" height="42" rx="3"/>
    <rect x="652" y="230" width="86" height="42" rx="3"/>
  </g>

  <!-- Mástil -->
  <g>
    <rect x="470" y="120" width="18" height="330" fill="url(#metal)"/>
    <rect x="500" y="120" width="18" height="330" fill="url(#metal)"/>
    <rect x="488" y="150" width="12" height="300" fill="#3D3D3D"/>
    <!-- Cadena -->
    <rect x="491" y="130" width="6" height="180" fill="#6E6E6E"/>
    <!-- Carro portahorquillas -->
    <rect x="462" y="300" width="64" height="26" rx="3" fill="#4A4A4A"/>
  </g>

  <!-- Horquillas con pallet -->
  <g>
    <rect x="518" y="316" width="14" height="96" fill="#9A9A9A"/>
    <rect x="518" y="398" width="150" height="14" fill="#9A9A9A"/>
    <!-- Pallet -->
    <g fill="#8B6B3E">
      <rect x="540" y="356" width="120" height="12" rx="2"/>
      <rect x="540" y="380" width="120" height="12" rx="2"/>
      <rect x="546" y="368" width="14" height="12"/>
      <rect x="592" y="368" width="14" height="12"/>
      <rect x="638" y="368" width="14" height="12"/>
    </g>
    <!-- Carga -->
    <rect x="546" y="292" width="108" height="64" rx="3" fill="#C9C9C9"/>
    <rect x="546" y="292" width="108" height="10" fill="#A8A8A8"/>
    <rect x="592" y="292" width="14" height="64" fill="#B0B0B0"/>
  </g>

  <!-- Contrapeso y chasis -->
  <g>
    <path d="M180 330h150v120H180a26 26 0 0 1-26-26v-68a26 26 0 0 1 26-26z" fill="url(#body)"/>
    <rect x="300" y="300" width="170" height="150" rx="8" fill="url(#body)"/>
    <rect x="300" y="300" width="170" height="14" fill="#B99400" opacity=".55"/>
    <!-- Franja de peligro -->
    <g clip-path="none">
      <rect x="160" y="424" width="310" height="14" fill="#111"/>
      <g fill="#F5C400">
        <path d="M170 424h14l-14 14h-14z"/><path d="M198 424h14l-14 14h-14z"/>
        <path d="M226 424h14l-14 14h-14z"/><path d="M254 424h14l-14 14h-14z"/>
        <path d="M282 424h14l-14 14h-14z"/><path d="M310 424h14l-14 14h-14z"/>
        <path d="M338 424h14l-14 14h-14z"/><path d="M366 424h14l-14 14h-14z"/>
        <path d="M394 424h14l-14 14h-14z"/><path d="M422 424h14l-14 14h-14z"/>
        <path d="M450 424h14l-14 14h-14z"/>
      </g>
    </g>
  </g>

  <!-- Cabina -->
  <g>
    <path d="M312 170h150v130H312z" fill="none" stroke="url(#body)" stroke-width="14"/>
    <rect x="306" y="160" width="164" height="18" rx="4" fill="url(#body)"/>
    <!-- Asiento -->
    <path d="M352 250h56v42h-56z" fill="#2E2E2E"/>
    <path d="M348 218h20v42h-20z" fill="#2E2E2E"/>
    <!-- Volante -->
    <circle cx="432" cy="262" r="19" fill="none" stroke="#3A3A3A" stroke-width="7"/>
  </g>

  <!-- Ruedas -->
  <g>
    <circle cx="238" cy="456" r="52" fill="#191919" stroke="#3A3A3A" stroke-width="6"/>
    <circle cx="238" cy="456" r="24" fill="#4E4E4E"/>
    <circle cx="238" cy="456" r="10" fill="#8A8A8A"/>
    <circle cx="424" cy="466" r="42" fill="#191919" stroke="#3A3A3A" stroke-width="6"/>
    <circle cx="424" cy="466" r="19" fill="#4E4E4E"/>
    <circle cx="424" cy="466" r="8" fill="#8A8A8A"/>
  </g>

  <!-- Baliza -->
  <g>
    <rect x="378" y="140" width="16" height="22" rx="3" fill="#E0A000"/>
    <circle cx="386" cy="140" r="12" fill="#F5C400" opacity=".28"/>
    <circle cx="386" cy="140" r="22" fill="#F5C400" opacity=".12"/>
  </g>

  <!-- Sombra -->
  <ellipse cx="330" cy="516" rx="220" ry="16" fill="#000" opacity=".45"/>
</svg>
